# 必须的组件服务分离，方便调试
version: '3'
services:
  knife4j-module:
    image: mrzhu66/knife4j-module:v1.0.1
    build: # 服务的 Docker 构建文件位置
      context: ./sql-father-modules/knife4j-module
      dockerfile: Dockerfile
    ports:
      - "8499:8499"
    networks:
      - mynetwork
    deploy:
      placement:
        constraints: [ node.labels.role==notebook_wsl ]

  gateway-module:
    image: mrzhu66/gateway-module:v1.0.1
    build: # 服务的 Docker 构建文件位置
      context: ./sql-father-modules/gateway-module
      dockerfile: Dockerfile
    ports:
      - "8500:8500"
    networks:
      - mynetwork
    deploy:
      placement:
        constraints: [ node.labels.role==notebook_wsl ]

networks:
  mynetwork:
    external: true