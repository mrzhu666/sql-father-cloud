
apiVersion: v1
kind: ConfigMap
metadata:
  name: seata-server-config
  namespace: sql-father
data:
  application.yml: |
    server:
      port: 7091
    
    spring:
      application:
        name: seata-server
    
    logging:
      config: classpath:logback-spring.xml
      file:
        path: ${log.home:${user.home}/logs/seata}
    
    console:
      user:
        username: admin
        password: adminadmin

    seata:
      security:
        secretKey: "please_change_me_to_a_long_secure_secret_key"
        tokenValidityInMilliseconds: 1800000
      config:
        # support: nacos, consul, apollo, zk, etcd3
        type: nacos
        nacos:
          server-addr: nacos-0.nacos-headless.sql-father.svc.cluster.local:8848
          group: SEATA_GROUP
          #      username: xxx
          #      password: xxx
          ##if use MSE Nacos with auth, mutex with username/password attribute
          #access-key: ""
          #secret-key: ""
          data-id: seataServer.properties
      registry:
        # support: nacos, eureka, redis, zk, consul, etcd3, sofa
        type: nacos
        nacos:
          application: seata-server
          server-addr: nacos-0.nacos-headless.sql-father.svc.cluster.local:8848
          group: SEATA_GROUP
          cluster: default
          #      username: xxx
          #      password: xxx
          ##if use MSE Nacos with auth, mutex with username/password attribute
          #access-key: ""
          #secret-key: ""

---
apiVersion: v1
kind: Service
metadata:
  name: seata-service
  namespace: sql-father
spec:
  selector:
    app: seata-server
  ports:
    - protocol: TCP
      name: service
      port: 8091
      targetPort: 8091
    - protocol: TCP
      name: console
      port: 7091
      targetPort: 7091

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seata-server
  namespace: sql-father
  labels:
    app: seata-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seata-server
  template:
    metadata:
      labels:
        app: seata-server
    spec:
      containers:
        - name: seata-server
          image: docker.io/seataio/seata-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: service
              containerPort: 8091
              protocol: TCP
            - name: console
              containerPort: 7091
              protocol: TCP
#          resources:
#            limits:
#              cpu: '2'
#              memory: 4Gi
#            requests:
#              cpu: '1'
#              memory: 2Gi
          volumeMounts:
            - name: seata-config
              mountPath: /seata-server/resources/application.yml
              subPath: application.yml
      volumes:
        - name: seata-config
          configMap:
            name: seata-server-config
